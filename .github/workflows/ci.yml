# v1 release gate: every push and pull request must keep the full local
# verification green. All third-party actions are pinned to immutable commit
# SHAs (never moving tags); the pinned version is noted beside each SHA.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # v4 — 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # v4 — 49933ea5288caeca8642d1e84afbd3f7d6820020
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-24.04
    steps:
      # v4 — 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # v4 — 49933ea5288caeca8642d1e84afbd3f7d6820020
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      # v4 — 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # v4 — 49933ea5288caeca8642d1e84afbd3f7d6820020
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-24.04
    steps:
      # v4 — 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # v4 — 49933ea5288caeca8642d1e84afbd3f7d6820020
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  secrets:
    runs-on: ubuntu-24.04
    steps:
      # v4 — 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      # v2 — ff98106e4c7b2bc287b24eaf42907196329070c7
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Browser checks that do not need a corpus: routing, security headers, the CSP
  # nonce contract, the shell, the API docs page, methodology and the UI
  # foundation gates. Data-dependent journeys (search results, priority ordering,
  # graph, watch hydration) stay local because several of them assert exact
  # corpus counts against a fixture database they swap in themselves; running them
  # in CI needs that fixture extracted into its own seed step first.
  e2e:
    runs-on: ubuntu-24.04
    env:
      APP_ENV: development
      PORT: "3000"
      DATA_DIR: ${{ github.workspace }}/.ci-data
      SCHEDULE_ENABLED: "false"
      INGEST_ON_START: "false"
      SITE_URL: http://localhost:3210
    steps:
      # v4 — 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # v4 — 49933ea5288caeca8642d1e84afbd3f7d6820020
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only Chromium: the suite is written against it and the job stays short.
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p .ci-data
      - run: npx playwright test csp public-surface shell api-docs methodology ui-foundation
