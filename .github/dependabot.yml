# Automated dependency updates for the v1 public repo. Grouped, weekly,
# and review-gated: updates arrive as pull requests that must pass the CI
# gate (test, lint, typecheck, build, secret scan) before merge. Never
# merge a major runtime bump without running the browser suite locally.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      production:
        patterns: ["*"]
        exclude-patterns: ["@playwright*", "vitest", "typescript", "eslint*"]
      tooling:
        patterns: ["@playwright*", "vitest", "typescript", "eslint*"]
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Base images are pinned by exact tag (node:24.x-bookworm-slim); review
    # the Dockerfile native-addon gates on every base-image bump.
    open-pull-requests-limit: 2
