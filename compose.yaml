# cve-change-radar — production-safe Compose default (todo 27).
#
# Normal launch: `docker compose up -d`
# One image, one container, one named volume. Debug off, no source bind
# mounts, no admin/debug ports. The published web port binds to loopback only;
# public exposure needs explicit binding + HTTPS setup (see README).
#
# Image contract: built from the repo Dockerfile as `cve-change-radar:local`.
# Plain `up -d` never rebuilds a stale image — see README for the exact
# update (`pull` for releases / `build`) vs rebuild commands.
#
# No `compose.override.yaml` is shipped on purpose: plain startup must never
# silently enable development behavior. Dev mode is an explicit opt-in:
# `docker compose -f compose.yaml -f compose.dev.yaml up`.

name: cve-change-radar

services:
  app:
    image: cve-change-radar:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: production
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      # Ingestion schedule: true (default) runs the worker's initial import
      # immediately on boot and keeps refreshing on the scheduler intervals.
      # false still runs ONE initial import on boot, then idles (no refresh).
      # Normal `docker compose up` therefore always populates data.
      SCHEDULE_ENABLED: ${SCHEDULE_ENABLED:-true}
      # Boot import gate: true (default) runs the worker's initial import
      # cycle on boot. false skips it entirely (worker idles, logs
      # worker-idle) so a seeded named volume serves immediately with zero
      # import contention against the web server. Combine with
      # SCHEDULE_ENABLED=false for a fully static serving deployment.
      INGEST_ON_START: ${INGEST_ON_START:-true}
    ports:
      # Loopback-bound by default. Host side honors $BIND_ADDR (default
      # 127.0.0.1) and $PORT (default 3000); the container always listens
      # on 3000 (see Dockerfile PORT/HOSTNAME).
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-3000}:3000"
    volumes:
      - cve-data:/data
    # Host-dependent sizing: the production host has 12 CPUs / 22 GB, so the
    # single container may use up to 4 CPUs / 4 GB. The old 1 CPU / 1 GB cap
    # let background imports starve request handling on a 395k-row corpus.
    # Retune for smaller hosts.
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G

volumes:
  cve-data:
    name: cve-change-radar-data
